name: Dashboard manual update (backup)

# The scheduled update now runs on the mainland server (Tencent Cloud, cron Mon-Sat 16:30 and
# 19:00 Beijing), which can reach the SZSE option report and Eastmoney push2 that GitHub's
# overseas runners cannot. The server pushes each day's data here as a backup, so this workflow
# has no schedule (two writers would conflict). Run it by hand only if the server is down.
# GitHub Pages serves the main branch root (dashboard/ holds the page).
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Build dashboard data
        env:
          TZ: Asia/Shanghai
        run: |
          python build_dashboard.py --out dashboard || (echo 'first attempt failed, retrying in 60 s' && sleep 60 && python build_dashboard.py --out dashboard)

      - name: Commit data archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard/data
          if git diff --cached --quiet; then echo 'no data change'; exit 0; fi
          git commit -m "dashboard data $(TZ=Asia/Shanghai date +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done

      - name: Request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds || echo 'Pages build request failed; the push itself normally triggers a build'
