# Blues dashboard: static files only, on its own high port. Added beside the existing sites.
server {
    listen 28473;
    listen [::]:28473;
    server_name _;

    root /opt/blues/dashboard;
    index index.html;
    autoindex off;
    server_tokens off;

    access_log /var/log/nginx/blues.access.log;
    error_log  /var/log/nginx/blues.error.log warn;

    # read-only: only GET / HEAD
    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
    }
    location /dashboard/ {
        return 301 /;
    }
    location /data/ {
        limit_except GET HEAD { deny all; }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location ~ /\. { deny all; }

    gzip on;
    gzip_types application/json application/javascript text/css;
}
